version: 2
updates:
  # Paketo builder image used by the Spring Boot `bootBuildImage` task. Gradle reads the image
  # from the FROM line of this directory's Dockerfile; no image is built from that file.
  - package-ecosystem: docker
    directory: /buildSrc/paketo-builder
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Batch all non-major bumps into a single PR to reduce noise.
      # Major version bumps land as individual PRs for review.
      minor-and-patch:
        update-types:
          - minor
          - patch
