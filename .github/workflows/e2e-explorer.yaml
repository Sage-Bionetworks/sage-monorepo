# Reusable workflow to run e2e tests for an Explorer (e.g. Agora, Model-AD, QTL, etc.)
on:
  workflow_call:
    inputs:
      explorer:
        required: true
        type: string
        description: The name of the Explorer to run e2e tests for
    secrets:
      SYNAPSE_AUTH_TOKEN:
        required: false
        description: Synapse PAT for explorer data sources

permissions:
  contents: read

jobs:
  validate-explorer-input:
    runs-on: ubuntu-22.04
    steps:
      - name: Check if explorer input is valid
        id: validate-explorer-input
        run: |
          if [[ "${{ inputs.explorer }}" != "agora" && "${{ inputs.explorer }}" != "model-ad" && "${{ inputs.explorer }}" != "qtl" ]]; then
            echo "Invalid Explorer input: ${{ inputs.explorer }}"
            exit 1
          fi
  authorize:
    # Skips the explorer-pr approval for fork PRs from users with write access.
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check that the PR author and the user who started the run have write access
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # Not triggering_actor: a re-run would swap in the re-runner and skip the approval.
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          author_permission=none
          actor_permission=none
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" && "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]]; then
            author_permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${PR_AUTHOR}/permission" --jq .permission) \
              || { echo "::warning::Could not read permission for ${PR_AUTHOR}; falling back to approval"; author_permission=none; }
            actor_permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission) \
              || { echo "::warning::Could not read permission for ${ACTOR}; falling back to approval"; actor_permission=none; }
          fi
          echo "PR author ${PR_AUTHOR}: ${author_permission}, started by ${ACTOR}: ${actor_permission}"
          if [[ "${author_permission}" =~ ^(admin|write)$ && "${actor_permission}" =~ ^(admin|write)$ ]]; then
            echo "authorized=true" >> "${GITHUB_OUTPUT}"
          else
            echo "authorized=false" >> "${GITHUB_OUTPUT}"
          fi
  run-explorer-e2e-tests:
    needs: [authorize, validate-explorer-input]
    # The explorer and explorer-pr environments should contain the same secrets. The explorer
    # environment runs automatically and is used for trusted code: pushes, same-repo PRs, and fork
    # PRs whose author and actor both have write access (see the authorize job). The explorer-pr
    # environment requires approval and is used for all other fork PRs.
    environment: ${{ github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      needs.authorize.outputs.authorized != 'true' &&
      format('{0}-pr', inputs.explorer) || inputs.explorer }}
    timeout-minutes: 60
    runs-on: ubuntu-22.04-4core-16GBRAM-150GBSSD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need to fetch all branches and commits so that Nx affected has a base to compare
          # against.
          fetch-depth: 0
          persist-credentials: false
          # By default, actions/checkout@v4 will checkout the main branch instead of the merge
          # commit when when using pull_request_target. It is currently difficult to checkout the
          # merge commit in this context. The current solution is to checkout the PR HEAD instead
          # and enable the branch protection rule "Require branches to be up to date before
          # merging".
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.head.sha || github.ref }}

      - name:
          Switch from the detached HEAD of the merge commit to a new branch
          # Buildx does not work on a detached HEAD
        run: git switch -c new-branch

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Set up the dev container
        id: setup-dev-container
        uses: ./.github/actions/setup-dev-container

      - name: Check if Explorer was affected
        id: explorer_affected
        run: |
          IFS=',' read -ra PROJECTS <<< "${{ steps.setup-dev-container.outputs.affected_projects }}"
          for project in "${PROJECTS[@]}"; do
            if [[ "$project" == "${{ inputs.explorer }}"-* ]]; then
              echo "affected=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "affected=false" >> "${GITHUB_OUTPUT}"

      - name: Install Playwright Browsers
        if: ${{ steps.explorer_affected.outputs.affected == 'true' }}
        run: |
          devcontainer exec --workspace-folder ../sage-monorepo bash -c ". ./dev-env.sh \
              && npx playwright install --with-deps"

      - name: Setup Explorer
        if: ${{ steps.explorer_affected.outputs.affected == 'true' }}
        run: |
          devcontainer exec --workspace-folder ../sage-monorepo bash -c ". ./dev-env.sh \
              && bash ./tools/setup-projects.sh ${{ inputs.explorer }}"

      - name: Build Explorer
        if: ${{ steps.explorer_affected.outputs.affected == 'true' }}
        env:
          cmd: '${{ inputs.explorer }}-build-images'
        run: |
          devcontainer exec --workspace-folder ../sage-monorepo bash -c ". ./dev-env.sh \
              && ${cmd}"

      # SYNAPSE_AUTH_TOKEN must be passed explicitly from the caller workflow (not via
      # `secrets: inherit`) so only this one secret is exposed to the reusable workflow.
      - name: Write Synapse PAT for Explorer
        if: ${{ steps.explorer_affected.outputs.affected == 'true' }}
        run: |
          env_filename="apps/${{ inputs.explorer }}/data/.env"
          if [ -f "$env_filename" ]; then
            sed -i "s/^SYNAPSE_AUTH_TOKEN=.*/SYNAPSE_AUTH_TOKEN=\"${{ secrets.SYNAPSE_AUTH_TOKEN }}\"/" "${env_filename}"
          else
            echo "${env_filename} not found for ${{ inputs.explorer }}. Skipping SYNAPSE_AUTH_TOKEN injection."
          fi

      - name: Start Explorer
        id: start-explorer
        if: ${{ steps.explorer_affected.outputs.affected == 'true' }}
        timeout-minutes: 40
        env:
          cmd: 'nx run ${{ inputs.explorer }}-apex:serve-detach'
        run: |
          devcontainer exec --workspace-folder ../sage-monorepo bash -c ". ./dev-env.sh \
              && ${cmd}"

      - name: Write out Explorer data logs
        if: ${{ failure() && steps.explorer_affected.outputs.affected == 'true' }}
        env:
          cmd: 'docker logs ${{ inputs.explorer }}-data > data-logs.txt'
        run: |
          devcontainer exec --workspace-folder ../sage-monorepo bash -c ". ./dev-env.sh \
              && ${cmd}"

      - name: Upload Explorer data logs
        if: ${{ failure() && steps.explorer_affected.outputs.affected == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'data-logs-${{ inputs.explorer }}'
          path: data-logs.txt
          retention-days: 5

      - name: Run Explorer e2e tests
        if: ${{ steps.explorer_affected.outputs.affected == 'true' }}
        env:
          cmd: 'CI=true nx run ${{ inputs.explorer }}-app:e2e --no-cloud'
        run: |
          devcontainer exec --workspace-folder ../sage-monorepo bash -c ". ./dev-env.sh \
              && ${cmd}"

      - name: Stop Explorer
        if: ${{ always() && steps.explorer_affected.outputs.affected == 'true' }}
        run: |
          devcontainer exec --workspace-folder ../sage-monorepo bash -c ". ./dev-env.sh \
              && workspace-docker-stop"

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.start-explorer.conclusion != 'failure' && steps.explorer_affected.outputs.affected == 'true' }}
        with:
          name: 'playwright-report-${{ inputs.explorer }}'
          path: playwright-report/
          retention-days: 5

      - name: Remove the dev container
        if: ${{ always() }}
        run: docker rm -f sage_devcontainer
