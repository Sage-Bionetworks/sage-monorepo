name: Lint Dockerfiles

on:
  push:
    branches:
      - main
      - 'agora/**'
      - 'sage-monorepo/**'
      - 'sage/**'
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        name: Checkout
        with:
          fetch-depth: 1

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          recursive: true
