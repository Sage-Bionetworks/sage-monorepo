# Hadolint is a Dockerfile linter: it reads each Dockerfile and flags bad practices and common
# mistakes. Rule exceptions live in .hadolint.yaml at the repo root
name: Lint Dockerfiles

on:
  push:
    branches:
      - main
      - 'agora/**'
      - 'sage-monorepo/**'
      - 'sage/**'
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
        with:
          fetch-depth: 1

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          # Search the whole repo for Dockerfiles instead of only ./Dockerfile.
          # Only files named "Dockerfile" are matched; variants like Dockerfile.generated are skipped.
          recursive: true
