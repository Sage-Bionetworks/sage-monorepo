name: Run e2e tests for Explorers

on:
  push:
  # pull_request_target gives fork PRs access to SYNAPSE_AUTH_TOKEN, so fork PR runs must use
  # an <explorer>-pr environment with required reviewers to prevent a "pwn request" (see the
  # authorize job in e2e-explorer.yaml for the write-access exception). The repo must also keep an
  # Actions event policy that allows pull_request_target, which GitHub blocks by default on public
  # repositories.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  run-explorer-e2e:
    # In the Sage repo, run on pushes to main and on every non-draft PR into main (under
    # pull_request_target, github.ref_name is the PR's base branch). In user-owned forks, run on
    # every push.
    if: ${{ (github.ref_name == 'main' || github.actor == github.repository_owner) && !github.event.pull_request.draft }}
    strategy:
      matrix:
        explorer:
          - agora
          - model-ad
          - qtl
    uses: ./.github/workflows/e2e-explorer.yaml
    with:
      explorer: ${{ matrix.explorer }}
    secrets:
      SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
