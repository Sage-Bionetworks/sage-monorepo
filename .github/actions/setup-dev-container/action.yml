name: 'Set up the dev container'
description: 'Installs the dev container CLI, fetches caches (if exist), and starts the dev container.'
inputs:
  devcontainer-user:
    description: 'The dev container user.'
    required: false
    default: 'ubuntu'
  gradle-cache:
    description: >-
      How to use the Gradle dependency cache: 'read-write' restores and saves it, 'read-only' only
      restores it, and 'none' skips it. Runs triggered by pull_request_target never save it.
    required: false
    default: 'read-write'
outputs:
  affected_projects:
    description: 'The list of affected Nx projects as a comma separated string.'
    value: ${{ steps.get-affected-projects.outputs.affected_projects }}
runs:
  using: 'composite'
  steps:
    # - name: Set up pnpm cache
    #   uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c #v3.5.0
    #   with:
    #     path: '/tmp/.pnpm-store'
    #     key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
    #     restore-keys: |
    #       ${{ runner.os }}-pnpm-store-

    # - name: Set up Renv cache
    #   uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c #v3.5.0
    #   with:
    #     path: '/tmp/.cache/R/renv/cache'
    #     key: ${{ runner.os }}-renv-cache-${{ hashFiles('**/renv.lock') }}
    #     restore-keys: |
    #       ${{ runner.os }}-renv-cache-

    # - name: Set up venv cache
    #   uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c #v3.5.0
    #   with:
    #     path: |
    #       /tmp/.local/share/virtualenv
    #       **/.venv
    #     key: ${{ runner.os }}-venv-${{ hashFiles('**/uv.lock') }}

    # Nx builds the Gradle project graph in every job, so without this cache each job downloads the
    # buildSrc plugins, and parallel jobs get rate limited (HTTP 429).
    # Only modules-2 (downloaded dependencies) is cached because gradle/verification-metadata.xml
    # re-checks those on every build. The unpacked wrapper distribution (checksum-checked only on
    # download) and Gradle's derived caches (compiled scripts, transformed jars) are never verified,
    # so they are rebuilt in every job instead.
    # pull_request_target runs fork PR code in the base branch's cache scope, so it is capped at
    # read-only: saving there would let a PR plant files that main and release builds restore.
    - name: Define the Gradle cache
      id: gradle-cache
      shell: bash
      env:
        REQUESTED_MODE: ${{ inputs.gradle-cache }}
        EVENT_NAME: ${{ github.event_name }}
        CACHE_KEY_PREFIX: ${{ runner.os }}-gradle-modules-
        CACHE_KEY_HASH: ${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml') }}
      run: |
        case "${REQUESTED_MODE}" in
          read-write | read-only | none) mode="${REQUESTED_MODE}" ;;
          *)
            echo "::error title=Invalid gradle-cache input::Expected read-write, read-only or none, got '${REQUESTED_MODE}'."
            exit 1
            ;;
        esac
        if [[ "${EVENT_NAME}" == "pull_request_target" && "${mode}" == "read-write" ]]; then
          mode="read-only"
        fi
        echo "Gradle cache mode: ${mode}"
        {
          echo "mode=${mode}"
          echo "key-prefix=${CACHE_KEY_PREFIX}"
          echo "key=${CACHE_KEY_PREFIX}${CACHE_KEY_HASH}"
          echo "paths<<EOF"
          echo "/tmp/.gradle/caches/modules-2"
          echo "!/tmp/.gradle/caches/modules-2/*.lock"
          echo "!/tmp/.gradle/caches/modules-2/gc.properties"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore and save the Gradle cache
      if: steps.gradle-cache.outputs.mode == 'read-write'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.gradle-cache.outputs.paths }}
        key: ${{ steps.gradle-cache.outputs.key }}
        restore-keys: ${{ steps.gradle-cache.outputs.key-prefix }}

    - name: Restore the Gradle cache (read-only)
      if: steps.gradle-cache.outputs.mode == 'read-only'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.gradle-cache.outputs.paths }}
        key: ${{ steps.gradle-cache.outputs.key }}
        restore-keys: ${{ steps.gradle-cache.outputs.key-prefix }}

    - name: Install the Dev Container CLI
      shell: bash
      run: npm install -g @devcontainers/cli@0.83.1

    - name: Start the dev container
      env:
        DEVCONTAINER_USER: ${{ inputs.devcontainer-user }}
        NX_CI_EXECUTION_ENV: 'ubuntu-22.04'
      shell: bash
      run: |
        mkdir -p \
          /tmp/.pnpm-store \
          /tmp/.cache/R/renv/cache \
          /tmp/.local/share/virtualenv \
          /tmp/.gradle/caches \
          /tmp/.gradle/wrapper

        devcontainer up \
          --mount type=bind,source=/tmp/.pnpm-store,target=/workspaces/sage-monorepo/.pnpm-store \
          --mount type=bind,source=/tmp/.cache/R/renv/cache,target=/home/${DEVCONTAINER_USER}/.cache/R/renv/cache \
          --mount type=bind,source=/tmp/.local/share/virtualenv,target=/home/${DEVCONTAINER_USER}/.local/share/virtualenv \
          --mount type=bind,source=/tmp/.gradle/caches,target=/home/${DEVCONTAINER_USER}/.gradle/caches \
          --mount type=bind,source=/tmp/.gradle/wrapper,target=/home/${DEVCONTAINER_USER}/.gradle/wrapper \
          --workspace-folder ../sage-monorepo

    - name: Check the Docker daemon in the dev container
      # Diagnostic only: warns instead of failing, because not every workflow needs Docker. The
      # docker-in-docker feature writes the daemon output to /tmp/dockerd.log in the container.
      # Run logs are public, so print only daemon and host state, never environment variables:
      # containerEnv secrets are already in the container. Keep this step before steps that add other secrets
      shell: bash
      run: |
        max_failures=15
        check_timeout_seconds=5
        retry_delay_seconds=2
        for attempt in $(seq 1 "${max_failures}"); do
          if timeout "${check_timeout_seconds}" \
            devcontainer exec --workspace-folder ../sage-monorepo docker info > /dev/null 2>&1; then
            echo "Docker is reachable in the dev container (attempt ${attempt} of ${max_failures})."
            exit 0
          else
            exit_code=$?
            echo "Docker is not reachable yet (attempt ${attempt} of ${max_failures}, exit code ${exit_code})."
          fi
          sleep "${retry_delay_seconds}"
        done

        echo "::warning title=Docker unreachable::The Docker daemon in the dev container did not respond. Open this step's log for diagnostics."

        echo "::group::Runner host"
        uname -a
        cat /etc/os-release
        echo "cgroup filesystem: $(stat -fc %T /sys/fs/cgroup)"
        echo "::endgroup::"

        echo "::group::Docker daemon in the dev container"
        stop_marker="$(cat /proc/sys/kernel/random/uuid)"
        echo "::stop-commands::${stop_marker}"
        devcontainer exec --workspace-folder ../sage-monorepo bash -c '
          ls -l /var/run/docker.sock
          pgrep -a dockerd || echo "dockerd is not running"
          sudo cat /tmp/dockerd.log' || true
        echo "::${stop_marker}::"
        echo "::endgroup::"

    - name: Prepare the workspace
      env:
        DEVCONTAINER_USER: ${{ inputs.devcontainer-user }}
      shell: bash
      run: |
        devcontainer exec --workspace-folder ../sage-monorepo bash -c "
          sudo chown -R ${DEVCONTAINER_USER}:${DEVCONTAINER_USER} \
            /workspaces/sage-monorepo \
            /home/${DEVCONTAINER_USER}/.cache \
            /home/${DEVCONTAINER_USER}/.local \
            /home/${DEVCONTAINER_USER}/.gradle \
          && . ./dev-env.sh \
          && workspace-install-nodejs-dependencies"

    - name: Get affected Nx projects
      id: get-affected-projects
      shell: bash
      # Nx writes errors to stdout, which the capture below would otherwise swallow on failure.
      # The output is printed between stop-commands markers so no line in it can run as a workflow command.
      run: |
        AFFECTED_PROJECTS=$(devcontainer exec --workspace-folder ../sage-monorepo bash -c "
          . ./dev-env.sh && nx show projects --affected --sep ','") || {
          exit_code=$?
          echo "::error title=Get affected Nx projects failed::The dev container command that runs nx show projects --affected exited with code ${exit_code}. Its output follows."
          stop_marker="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::${stop_marker}"
          echo "${AFFECTED_PROJECTS}"
          echo "::${stop_marker}::"
          exit "${exit_code}"
        }
        echo "Affected projects: $AFFECTED_PROJECTS"
        echo "affected_projects=$AFFECTED_PROJECTS" >> $GITHUB_ENV
        echo "affected_projects=$AFFECTED_PROJECTS" >> $GITHUB_OUTPUT
