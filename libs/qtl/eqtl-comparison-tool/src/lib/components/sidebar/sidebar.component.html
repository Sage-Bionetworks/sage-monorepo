@if (selectedEqtlView(); as eqtl) {
  <div class="sidebar-chiclets" role="list" [attr.aria-label]="chicletListAriaLabel">
    <qtl-metadata-chiclet
      role="listitem"
      backgroundColor="var(--color-variant-muted)"
      label="variant"
      [value]="eqtl.variant"
    />
    <qtl-metadata-chiclet
      role="listitem"
      backgroundColor="var(--color-gene-muted)"
      label="gene"
      [value]="eqtl.geneSymbol"
    />
    <qtl-metadata-chiclet
      role="listitem"
      [backgroundColor]="eqtl.cellClassBackgroundColor"
      label="cell class"
      [value]="eqtl.cellClass.name"
    />
    <qtl-metadata-chiclet
      role="listitem"
      [backgroundColor]="eqtl.cellSubclass.color"
      textColor="var(--color-white)"
      label="cell subclass"
      [value]="eqtl.cellSubclass.name"
    />
  </div>
}

<div role="tablist" class="sidebar-tabs">
  @for (tab of tabs; track tab.value; let i = $index) {
    <button
      #tabButton
      [id]="'tab-' + tab.value"
      role="tab"
      type="button"
      [class.active]="activeTab() === tab.value"
      [attr.aria-selected]="activeTab() === tab.value"
      [attr.aria-controls]="'tabpanel-' + tab.value"
      [attr.tabindex]="activeTab() === tab.value ? 0 : -1"
      (click)="activeTab.set(tab.value)"
      (keydown)="onTabKeydown($event, i)"
    >
      {{ tab.label }}
    </button>
  }
</div>
<hr class="sidebar-divider" />
<div
  role="tabpanel"
  class="sidebar-tabpanel"
  [id]="'tabpanel-' + activeTab()"
  [attr.aria-labelledby]="'tab-' + activeTab()"
>
  @switch (activeTab()) {
    @case ('impact') {
      @if (selectedEqtlView(); as eqtl) {
        <qtl-eqtl-comparison-tool-impact-details [details]="eqtl.impactDetails" />
        @if (impactPlotData(); as plotData) {
          <qtl-eqtl-comparison-tool-impact-boxplot
            class="sidebar-impact-boxplot"
            [cellSubclass]="eqtl.cellSubclass"
            [expressionSummaries]="plotData.expressionSummaries"
          />
          <qtl-eqtl-comparison-tool-impact-forest-plot
            class="sidebar-impact-forest-plot"
            [selectedCellClassId]="eqtl.cellSubclass.cellClassId"
            [effectSizes]="plotData.effectSizes"
          />
        }
        <!-- TODO: add the remaining impact tab content (EX-73) -->
      } @else {
        <p class="sidebar-no-data">{{ noDataMessage }}</p>
      }
    }
    @case ('legend') {
      <qtl-eqtl-comparison-tool-legend />
    }
  }
</div>
