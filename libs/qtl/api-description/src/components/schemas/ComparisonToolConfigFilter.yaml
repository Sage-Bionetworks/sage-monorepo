type: object
description: Comparison Tool Config Filter
properties:
  name:
    type: string
    description: Name of the filter group
    example: 'Cell Class'
  data_key:
    type: string
    description: Field to filter on
    example: 'cell_class'
  short_name:
    type: string
    description: Short name of the filter group
    example: 'Class'
  query_param_key:
    type: string
    description: Query parameter key for the filter
    example: 'cellClass'
  type:
    type: string
    enum:
      - list
      - search
    description: The type of the filter. Must be 'list' or 'search'.
  values:
    type: array
    description: List of filter values
    items:
      type: string
      example: 'Astrocyte'
required:
  - name
  - data_key
  - query_param_key
  - type
  - values
