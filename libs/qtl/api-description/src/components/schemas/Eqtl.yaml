type: object
description: eQTL
properties:
  composite_id:
    type: string
    description: Unique identifier for the eQTL object
    example: rs12655812~ENSG00000250891~astro
  variant:
    type: string
    description: Variant ID
    example: rs12655812
  variant_location:
    $ref: ./GenomicLocation.yaml
  effect_direction:
    $ref: ./EffectDirection.yaml
  gene_symbol:
    type: string
    description: Gene symbol
    example: LINC02208
  ensembl_gene_id:
    type: string
    description: Ensembl gene ID
    example: ENSG00000250891
  gene_location:
    $ref: ./GenomicLocation.yaml
  beta:
    type: number
    description: Effect size
    example: 0.608491
  adj_p_val:
    type: string
    description: Adjusted p-value, preformatted for display
    example: 2.61E-162
  adj_p_val_numeric:
    type: number
    description: Base-10 logarithm of the adjusted p-value
    example: -161.583901
  maf:
    type: number
    description: Minor allele frequency
    example: 0.1418
  minor_allele:
    type: string
    description: Minor allele
    example: C
  reference_allele:
    type: string
    description: Reference allele
    example: T
  cell_type_id:
    type: string
    description: Cell type ID
    example: astro
  cell_class:
    type: string
    description: Cell class
    example: Astrocyte
  cell_class_short:
    type: string
    description: Abbreviated cell class
    example: Astro
  cell_subclass:
    type: string
    description: Cell subclass
    example: Astrocyte
  cell_subclass_short:
    type: string
    description: Abbreviated cell subclass
    example: Astro
required:
  - composite_id
  - variant
  - variant_location
  - effect_direction
  - gene_symbol
  - ensembl_gene_id
  - gene_location
  - beta
  - adj_p_val
  - adj_p_val_numeric
  - maf
  - minor_allele
  - reference_allele
  - cell_type_id
  - cell_class
  - cell_class_short
  - cell_subclass
  - cell_subclass_short
