type: object
description: A paginated response containing eQTL objects and pagination metadata.
properties:
  eqtls:
    type: array
    description: The list of eQTL objects for the current page
    items:
      $ref: ./Eqtl.yaml
  page:
    $ref: ./PageMetadata.yaml
  selectedRowInResults:
    description: |
      Over the full filtered results, whether they contain the row named by the request's
      selectedRowId, regardless of the current page. A row listed in the request's items is not in
      them, so it answers false. Null when the request carries no selectedRowId or itemFilterType is
      'include'.
    type: boolean
    nullable: true
required:
  - eqtls
  - page
