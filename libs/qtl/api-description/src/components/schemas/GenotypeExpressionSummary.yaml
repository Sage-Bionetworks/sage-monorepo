type: object
description: Five-number summary of gene expression for samples with one genotype.
properties:
  genotype:
    type: string
    description: Genotype
    example: CT
  min:
    type: number
    description: Minimum expression
    example: -2.2889
  first_quartile:
    type: number
    description: First quartile of expression
    example: -0.5532
  median:
    type: number
    description: Median expression
    example: -0.004
  third_quartile:
    type: number
    description: Third quartile of expression
    example: 0.6039
  max:
    type: number
    description: Maximum expression
    example: 2.3396
required:
  - genotype
  - min
  - first_quartile
  - median
  - third_quartile
  - max
