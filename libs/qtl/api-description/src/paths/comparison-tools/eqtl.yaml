get:
  tags:
    - eQTL
  summary: Get eQTL comparison data
  description: Returns a paginated list of eQTL objects for use in comparison tools.
  operationId: getEqtls
  parameters:
    - $ref: ../query/eqtlSearchQuery.yaml
  responses:
    '200':
      description: A paginated response containing eQTL objects
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/EqtlsPage.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '500':
      $ref: ../../components/responses/InternalServerError.yaml
