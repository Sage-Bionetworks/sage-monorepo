# Redocly configuration file for QTL API

apis:
  qtl-public:
    root: ./src/api.openapi.yaml
    decorators:
      remove-x-internal:
        internalFlagProperty: 'x-sage-internal'
      info-override:
        version: 1.0.0
        title: QTL API
        license:
          name: Apache 2.0
          url: https://github.com/Sage-Bionetworks/sage-monorepo/blob/main/LICENSE.txt
        contact:
          name: Support
          url: https://github.com/Sage-Bionetworks/sage-monorepo
        x-logo:
          url: https://xqtlexplorer.adknowledgeportal.org/opengraph/opengraph.png
          altText: xQTL Explorer

  # Service API (consumed by server stub generation)
  api-service:
    root: ./src/api.openapi.yaml
