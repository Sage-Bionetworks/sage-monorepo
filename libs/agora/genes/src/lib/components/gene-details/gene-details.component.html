<div [class]="{ 'gene-details': true, loading: isLoading }">
  @if (isLoading) {
    <div id="loading">
      <explorers-loading-icon />
    </div>
  } @else if (gene) {
    <agora-gene-hero [gene]="gene" />
    <explorers-panel-navigation
      [panels]="panels"
      (panelChange)="onPanelChange($event)"
      [activePanel]="activePanel"
      [activeParent]="activeParent"
      [scrollToPanelNavElementOnInitialLoad]="scrollToPanelNavElementOnInitialLoad"
    />
    <div class="panel-content">
      @switch (activePanel) {
        @case ('summary') {
          <agora-gene-soe [gene]="gene" />
        }
        @case ('rna') {
          <agora-gene-evidence-rna [gene]="gene" />
        }
        @case ('protein') {
          <agora-gene-evidence-proteomics [gene]="gene" />
        }
        @case ('metabolomics') {
          <agora-gene-evidence-metabolomics [gene]="gene" />
        }
        @case ('resources') {
          <agora-gene-resources [gene]="gene" />
        }
        @case ('nominations') {
          <agora-gene-nominations [gene]="gene" />
        }
        @case ('experimental-validation') {
          <agora-gene-experimental-validation [gene]="gene" />
        }
      }
    </div>
  }
</div>
