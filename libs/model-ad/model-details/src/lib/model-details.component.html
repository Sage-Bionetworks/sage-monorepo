<div [class]="{ 'model-details': true, loading: isLoading }">
  @if (isLoading) {
    <div id="loading">
      <explorers-loading-icon />
    </div>
  } @else if (model) {
    @switch (model.type) {
      @case ('marmoset') {
        <h1>{{ model.name }}</h1>
      }
      @case ('mouse') {
        @if (mouseModel; as mouseModel) {
          <model-ad-model-details-hero [model]="mouseModel" />
          <explorers-panel-navigation
            [panels]="panels"
            (panelChange)="onPanelChange($event)"
            [activePanel]="activePanel"
            [activeParent]="activeParent"
            [scrollToPanelNavElementOnInitialLoad]="scrollToPanelNavElementOnInitialLoad"
          />
          <div class="panel-content">
            @switch (activePanel) {
              @case ('omics') {
                <model-ad-model-details-omics [model]="mouseModel" />
              }
              @case ('biomarkers') {
                <model-ad-mouse-model-details-boxplots-selector
                  [title]="'Biomarkers'"
                  [modelName]="mouseModel.name"
                  [modelControls]="mouseModel.matched_controls"
                  [modelDataList]="mouseModel.biomarkers"
                  [wikiParams]="biomarkersWikiParams"
                />
              }
              @case ('pathology') {
                <model-ad-mouse-model-details-boxplots-selector
                  [title]="'Pathology'"
                  [modelName]="mouseModel.name"
                  [modelControls]="mouseModel.matched_controls"
                  [modelDataList]="mouseModel.pathology"
                  [wikiParams]="pathologyWikiParams"
                />
              }
              @case ('resources') {
                <model-ad-model-details-resources [model]="mouseModel" />
              }
            }
          </div>
        }
      }
    }
  }
</div>
