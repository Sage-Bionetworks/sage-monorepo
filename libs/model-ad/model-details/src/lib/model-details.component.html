<div [class]="{ 'model-details': true, loading: isLoading }">
  @if (isLoading) {
    <div id="loading">
      <explorers-loading-icon />
    </div>
  } @else if (model) {
    @switch (model.type) {
      @case ('marmoset') {
        @if (marmosetModel; as marmosetModel) {
          <model-ad-marmoset-model-details-content
            [model]="marmosetModel"
            [panels]="panels"
            [activePanel]="activePanel"
            [activeParent]="activeParent"
            [scrollToPanelNavElementOnInitialLoad]="scrollToPanelNavElementOnInitialLoad"
            (panelChange)="onPanelChange($event)"
          />
        }
      }
      @case ('mouse') {
        @if (mouseModel; as mouseModel) {
          <model-ad-mouse-model-details-content
            [model]="mouseModel"
            [panels]="panels"
            [activePanel]="activePanel"
            [activeParent]="activeParent"
            [scrollToPanelNavElementOnInitialLoad]="scrollToPanelNavElementOnInitialLoad"
            (panelChange)="onPanelChange($event)"
          />
        }
      }
    }
  }
</div>
