type: object
description: Proteomics individual filter query options
properties:
  tissue:
    description: Tissue type to filter by
    type: string
    example: 'Hippocampus'
  modelIdentifier:
    description: The model name or model group to filter by
    type: string
    example: '5xFAD (Jax/IU/Pitt)'
  modelIdentifierType:
    description: Specifies whether modelIdentifier is a name or modelGroup
    $ref: ./ModelIdentifierType.yaml
  uniqueId:
    description: Unique ID to filter by
    type: string
    example: 'ENSMUSG00000000001P27144'
required:
  - tissue
  - uniqueId
  - modelIdentifier
  - modelIdentifierType
