type: object
description: A paginated response containing proteomics objects and pagination metadata.
properties:
  proteomics:
    type: array
    description: The list of proteomics objects for the current page
    items:
      $ref: ./Proteomics.yaml
  page:
    $ref: ./PageMetadata.yaml
  hasRowsForPrebudgetedParents:
    description: |
      Over the full match set, whether at least one row's parent ID is in the request's
      prebudgetedParentIds. Null when the request carries none. A pure predicate over the match set,
      so it answers the one question a consumer holding a single page cannot answer for itself:
      whether a further budgeted request could still admit rows of parents it has already accounted
      for.
    type: boolean
    nullable: true
required:
  - proteomics
  - page
