type: object
description: Proteomics search query with pagination and filtering options.
properties:
  pageNumber:
    description: The page number.
    type: integer
    format: int32
    default: 0
    minimum: 0
    example: 0
  pageSize:
    description: The number of items in a single page.
    type: integer
    format: int32
    default: 100
    minimum: 1
    # Worst-case gene-to-protein fan-out for the current data, so a full pin set of genes survives
    # a fan-out into this view within a single page. A stopgap; see MG-1121.
    maximum: 300
    example: 100
  remainingBudget:
    description: |
      Maximum number of new matching results to admit, letting a client retrieve matching rows
      from beyond the current page in a single request. It counts unique parents for a
      parent/child comparison tool and rows otherwise. When set, pageNumber and pageSize are
      ignored. Only applied when itemFilterType is 'exclude'.
    type: integer
    format: int32
    minimum: 0 # 0 admits only the free children of prebudgetedParentIds
    maximum: 50 # this CT's pin limit -- keep in sync with the frontend's MAX_PINNED_ITEMS
    nullable: true
    example: 50
  categories:
    description: |
      Array of category values from the dropdown selections.
      The API will parse these to extract the tissue information.
      Expected format: [mainCategory, tissueCategory]
    type: array
    items:
      type: string
    minItems: 2
    maxItems: 2
    example: ['PROTEIN - DIFFERENTIAL EXPRESSION', 'Tissue - Hemibrain']
  items:
    description: |
      List of composite identifiers to filter by. Each identifier uses the format "unique_id~name~sex"
      where each identifier represents one complete combination of unique ID, gene name, and sex.

      Example: "ENSMUSG11111111110P11110~LOAD2~Female" filters for documents matching that exact unique ID, name, and sex.
      Multiple items can be provided to filter for multiple specific combinations.
    type: array
    items:
      type: string
    nullable: true
    example: ['ENSMUSG11111111110P11110~LOAD2~Female', 'ENSMUSG11111111111P11111~LOAD1~Male']
  itemFilterType:
    $ref: ItemFilterTypeQuery.yaml
    nullable: true
  itemIdSpace:
    $ref: ItemIdSpaceQuery.yaml
    nullable: true
  prebudgetedParentIds:
    description: |
      Parent IDs that are already accounted for, each using the format "ensembl_gene_id~name~sex".
      On a budgeted request the rows of these parents are always returned, outside the budget, and
      remainingBudget is spent only on parents not in this set. On any request the set also drives
      hasRowsForPrebudgetedParents in the response, so send it on a paginated request once the
      budget is exhausted to learn whether any further rows could still be admitted through parents
      already accounted for. Always matched against the parent ID field, independently of
      itemIdSpace, which governs only the items array. Only applied when itemFilterType is
      'exclude'.
    type: array
    items:
      type: string
    maxItems: 50 # this CT's pin limit -- keep in sync with the frontend's MAX_PINNED_ITEMS
    nullable: true
    example: ['ENSMUSG00000000001~LOAD2~Female']
  search:
    description: |
      Search by identifier. A single term is a case-insensitive partial match on the displayed symbol,
      which embeds the gene symbol and UniProt ID, or the Ensembl gene ID and UniProt ID when the gene
      symbol is unavailable. A single term that is a complete Ensembl gene ID is instead a case-insensitive
      full match on the Ensembl gene ID, so it also reaches rows whose displayed symbol shows a gene symbol.
      A comma separated list full-matches each term, case-insensitively, against the Ensembl gene ID,
      gene symbol, or UniProt ID.
      Examples: 'ensa,P27144,ENSMUSG00000000001' (comma-separated list), 'ENSMUSG00000000001'
      (complete Ensembl gene ID) or 'gna' (partial match). Only applied when itemFilterType is 'exclude'.
    type: string
    nullable: true
    example: 'ensa,P27144,ENSMUSG00000000001'
  biodomains:
    description: Filter by biological domains.
    type: array
    items:
      type: string
    nullable: true
    example: ['Apoptosis', 'Cell Cycle']
  modelType:
    description: Filter by model type.
    type: array
    items:
      type: string
    nullable: true
    example: ['Familial AD', 'Late Onset AD']
  name:
    description: Filter by mouse model name.
    type: array
    items:
      type: string
    nullable: true
    example: ['3xTg-AD', '5xFAD (IU/Jax/Pitt)']
  sex:
    description: Filter by sex.
    type: array
    items:
      type: string
    nullable: true
    example: ['Female', 'Male']
  sortFields:
    description: |
      List of field names to sort by (e.g., "display_symbol,name").
      Each field in sortFields must have a corresponding order in sortOrders.
    type: array
    items:
      type: string
    minItems: 1
    example: [display_symbol, name]
  sortOrders:
    description: |
      List of sort directions corresponding to sortFields.
      Values: 1 (ascending) or -1 (descending).
      Must have the same length as sortFields.
    type: array
    items:
      type: integer
      format: int32
      enum: [1, -1]
    minItems: 1
    example: [1, -1]
required:
  - categories
  - sortFields
  - sortOrders
