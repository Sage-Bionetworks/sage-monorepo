type: object
description: Search result
properties:
  id:
    type: string
    description: ID of result
  match_field:
    type: string
    description: Field that matched the query
  match_value:
    type: string
    description: Value that matched the query
  model_organism:
    $ref: ./ModelOrganism.yaml
  precedence:
    type: integer
    description: Rank of the field that matched, used to order results (lower first)
required:
  - id
  - match_field
  - match_value
  - model_organism
  - precedence
