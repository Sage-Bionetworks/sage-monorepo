type: object
description: Proteomics Individual
properties:
  ensembl_gene_id:
    type: string
    description: Ensembl Gene ID
  gene_symbol:
    type: string
    description: Gene Symbol
    example: Fkbp9
  uniprotid:
    type: string
    description: UniProt ID
    example: Q9Z247
  unique_id:
    type: string
    description: Concatenation of the Ensembl Gene ID and the UniProt ID
    example: ENSMUSG00000029781Q9Z247
  display_symbol:
    type: string
    description: Gene symbol and UniProt ID, falling back to the Ensembl Gene ID when the gene symbol is unavailable
    example: Fkbp9 (Q9Z247)
  tissue:
    type: string
    description: Tissue type
    example: Hemibrain
  name:
    type: string
    description: Model name
  model_group:
    type: string
    description: Model group
    nullable: true
  matched_control:
    type: string
    description: Matched control for the model
    example: LOAD1
  # TODO(MG-985): update the units example when the confirmed value lands
  units:
    type: string
    description: Units of measurement for proteomics data
    example: Log2 Counts per Million
  age:
    type: string
    description: Age of the model
    example: 4 months
  age_numeric:
    type: integer
    description: Numeric representation of the age
    example: 4
  result_order:
    type: array
    items:
      type: string
    description: List of genotypes in the order to display results
    example: ['LOAD1', 'LOAD2']
  data:
    type: array
    description: List of individual proteomics data points
    items:
      $ref: ./IndividualData.yaml
required:
  - ensembl_gene_id
  - gene_symbol
  - uniprotid
  - unique_id
  - display_symbol
  - tissue
  - name
  - matched_control
  - units
  - age
  - age_numeric
  - result_order
  - data
