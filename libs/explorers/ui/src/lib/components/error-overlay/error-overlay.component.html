@if (isOverlayVisible()) {
  <dialog
    #dialog
    class="warning-banner"
    role="alertdialog"
    aria-labelledby="error-overlay-message"
    (keydown.escape)="$event.preventDefault()"
    (cancel)="$event.preventDefault()"
  >
    <div class="warning-banner-message">
      <i class="pi pi-exclamation-triangle warning-icon" aria-hidden="true"></i>
      <span id="error-overlay-message" aria-live="assertive">{{ activeMessage() }}</span>
    </div>
    <button class="reload-button" (click)="onReload()">Reload Page</button>
  </dialog>
}
