@if (platformService.isBrowser) {
  <p-dialog
    [header]="panes.length > 0 ? panes[activePane].heading : ''"
    [visible]="comparisonToolService.isTutorialVisible()"
    (visibleChange)="comparisonToolService.setTutorialVisibility($event)"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [dismissableMask]="true"
    [style]="dialogStyle"
    styleClass="tutorial-panel"
    (onHide)="onHide()"
  >
    <div class="tutorial-panel-panes">
      @for (pane of panes; track pane; let i = $index) {
        <div class="tutorial-panel-pane" [ngClass]="{ active: activePane === i }">
          @if (activePane === i) {
            <div [innerHtml]="pane.content"></div>
          }
        </div>
      }
    </div>

    <ng-template #footer>
      <div class="checkbox">
        <p-checkbox
          [ngModel]="willHide"
          (ngModelChange)="setWillHide($event)"
          [binary]="true"
          size="small"
          inputId="hideDialog"
        />
        <label for="hideDialog">Don't show this again</label>
      </div>
      <div>
        @if (activePane > 0) {
          <p-button
            styleClass="tutorial-panel-previous"
            label="Back"
            (click)="previous()"
            [rounded]="true"
            size="small"
            icon="pi pi-angle-left"
            variant="outlined"
          ></p-button>
        }
        @if (activePane !== panes.length - 1) {
          <p-button
            label="Next"
            (click)="next()"
            [rounded]="true"
            size="small"
            icon="pi pi-angle-right"
            iconPos="right"
          ></p-button>
        }
        @if (activePane === panes.length - 1) {
          <p-button label="Close" (click)="close()" [rounded]="true" size="small"></p-button>
        }
      </div>
    </ng-template>
  </p-dialog>
}
