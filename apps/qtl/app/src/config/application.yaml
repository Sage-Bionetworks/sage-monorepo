# Base configuration for QTL App
# Default values can be overridden by:
# 1. Profile-specific files (e.g., application-dev.yaml)
# 2. Environment variables (e.g., APP_VERSION, CSR_API_URL, GOOGLE_TAG_MANAGER_ID)

appVersion: local
commitSha: ''
csrApiUrl: http://localhost:8000/api/v1
ssrApiUrl: http://qtl-api:3333/v1
apiDocsUrl: http://localhost:8000/api-docs
googleTagManagerEnabled: true
googleTagManagerId: ''
sentryDsn: ''
sentryEnvironment: ''
sentryRelease: ''
# Unset (null) turns performance tracing off; set SENTRY_TRACES_SAMPLE_RATE to a number from 0 to 1.
sentryTracesSampleRate: null
environment: dev
