openapi: 3.0.3
info:
  contact:
    name: Support
    url: https://github.com/Sage-Bionetworks/sage-monorepo
  license:
    name: Apache 2.0
    url: https://github.com/Sage-Bionetworks/sage-monorepo/blob/main/LICENSE.txt
  title: QTL API
  version: 1.0.0
  x-logo:
    url: https://xqtlexplorer.adknowledgeportal.org/opengraph/opengraph.png
    altText: xQTL Explorer
servers:
  - description: Local development server
    url: http://localhost/v1
tags:
  - description: Operations about Comparison Tool UI configuration.
    name: Comparison Tool Config
  - description: Operations about the data version.
    name: Data Version
  - description: Operations about eQTLs.
    name: Eqtl
paths:
  /comparison-tools/config:
    get:
      description: Retrieve the Comparison Tool configuration schema for the xQTL
        Explorer application
      operationId: getComparisonToolConfig
      parameters:
        - description: Name of the page to retrieve the Comparison Tool configuration
            for
          explode: true
          in: query
          name: page
          required: true
          schema:
            $ref: '#/components/schemas/ComparisonToolPage'
          style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ComparisonToolConfig'
                type: array
          description: Successfully retrieved Comparison Tool configuration
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get Comparison Tool configuration
      tags:
        - Comparison Tool Config
      x-accepts:
        - application/json
        - application/problem+json
      x-tags:
        - tag: Comparison Tool Config
  /comparison-tools/eqtl:
    get:
      description: Returns a paginated list of eQTL objects for use in comparison
        tools.
      operationId: getEqtls
      parameters:
        - description: The search query used to find and filter eQTLs.
          explode: true
          in: query
          name: eqtlSearchQuery
          required: false
          schema:
            $ref: '#/components/schemas/EqtlSearchQuery'
          style: deepObject
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EqtlsPage'
          description: A paginated response containing eQTL objects
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get eQTL comparison data
      tags:
        - Eqtl
      x-accepts:
        - application/json
        - application/problem+json
      x-tags:
        - tag: Eqtl
  /data-version:
    get:
      description: Get data version
      operationId: getDataVersion
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataVersion'
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get data version
      tags:
        - Data Version
      x-accepts:
        - application/json
        - application/problem+json
      x-tags:
        - tag: Data Version
components:
  parameters:
    eqtlSearchQuery:
      description: The search query used to find and filter eQTLs.
      explode: true
      in: query
      name: eqtlSearchQuery
      required: false
      schema:
        $ref: '#/components/schemas/EqtlSearchQuery'
      style: deepObject
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BasicError'
      description: Invalid request
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BasicError'
      description: The specified resource was not found
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BasicError'
      description: The request cannot be fulfilled due to an unexpected server error
  schemas:
    ComparisonToolPage:
      description: The type of comparison tool page
      enum:
        - eQTLs
      example: eQTLs
      type: string
    ComparisonToolConfigColumn:
      example:
        name: name
        tooltip: tooltip
        is_hidden: true
        link_url: link_url
        sort_tooltip: sort_tooltip
        column_width: 300
        is_exported: true
        type: text
        data_key: data_key
        link_text: link_text
      properties:
        name:
          description: The display name of the column.
          type: string
        type:
          description: "The data type of the column. Must be 'text', 'heat_map', 'link_internal',\
            \ 'link_external', 'primary', or 'numeric', where 'primary' is the primary\
            \ key column that uniquely identifies each record in the table."
          enum:
            - text
            - heat_map
            - link_internal
            - link_external
            - primary
            - numeric
          type: string
        data_key:
          description: The key used to retrieve data for this column from the data
            source.
          type: string
        tooltip:
          description: Tooltip text for the column.
          type: string
        sort_tooltip:
          description: Tooltip text for the column's sort functionality.
          type: string
        link_text:
          description: The default text for a link in this column.
          type: string
        link_url:
          description: The default URL for this column.
          type: string
        is_exported:
          description: Indicates whether the column is included in data exports.
          type: boolean
        is_hidden:
          description: Indicates whether the column is shown in the comparison table
            UI.
          type: boolean
        column_width:
          description: "Optional fixed width for the column in pixels. When set, the\
            \ UI uses this width verbatim instead of auto-sizing the column from content."
          example: 300
          format: int32
          minimum: 1
          type: integer
      required:
        - data_key
        - is_exported
        - is_hidden
        - type
      type: object
    ComparisonToolConfigFilter:
      description: Comparison Tool Config Filter
      example:
        values:
          - Astrocyte
          - Astrocyte
        name: Cell Class
        short_name: Class
        type: list
        data_key: cell_class
        query_param_key: cellClass
      properties:
        name:
          description: Name of the filter group
          example: Cell Class
          type: string
        data_key:
          description: Field to filter on
          example: cell_class
          type: string
        short_name:
          description: Short name of the filter group
          example: Class
          type: string
        query_param_key:
          description: Query parameter key for the filter
          example: cellClass
          type: string
        type:
          description: The type of the filter. Must be 'list' or 'search'.
          enum:
            - list
            - search
          type: string
        values:
          description: List of filter values
          items:
            example: Astrocyte
            type: string
          type: array
      required:
        - data_key
        - name
        - query_param_key
        - type
        - values
      type: object
    ComparisonToolNoun:
      description: |
        A noun used to label a set of records in the comparison tool UI, in both its singular and
        plural forms.
      example:
        singular: protein
        plural: proteins
      properties:
        singular:
          description: The singular form of the noun.
          example: protein
          type: string
        plural:
          description: The plural form of the noun.
          example: proteins
          type: string
      required:
        - plural
        - singular
      type: object
    ComparisonToolConfig:
      example:
        parent_id_data_key: rna_composite_id
        columns:
          - name: name
            tooltip: tooltip
            is_hidden: true
            link_url: link_url
            sort_tooltip: sort_tooltip
            column_width: 300
            is_exported: true
            type: text
            data_key: data_key
            link_text: link_text
          - name: name
            tooltip: tooltip
            is_hidden: true
            link_url: link_url
            sort_tooltip: sort_tooltip
            column_width: 300
            is_exported: true
            type: text
            data_key: data_key
            link_text: link_text
        row_id_data_key: composite_id
        page: eQTLs
        dropdowns:
          - dropdowns
          - dropdowns
        filters:
          - values:
              - Astrocyte
              - Astrocyte
            name: Cell Class
            short_name: Class
            type: list
            data_key: cell_class
            query_param_key: cellClass
          - values:
              - Astrocyte
              - Astrocyte
            name: Cell Class
            short_name: Class
            type: list
            data_key: cell_class
            query_param_key: cellClass
        row_count: row_count
        parent_noun:
          singular: gene
          plural: genes
        view_noun:
          singular: protein
          plural: proteins
      properties:
        page:
          $ref: '#/components/schemas/ComparisonToolPage'
        dropdowns:
          description: List of dropdown options
          items:
            type: string
          type: array
        row_count:
          description: Deprecated field that is always null. Previously contained
            relative description of the total number of rows in the data
          nullable: true
          type: string
        columns:
          description: List of column definitions
          items:
            $ref: '#/components/schemas/ComparisonToolConfigColumn'
          type: array
        filters:
          description: List of filter configurations
          items:
            $ref: '#/components/schemas/ComparisonToolConfigFilter'
          type: array
        row_id_data_key:
          description: |
            The data key holding this view's row UID, overriding the comparison tool's default row id
            key for this view. Null when the view declares no hierarchy.
          example: composite_id
          nullable: true
          type: string
        parent_id_data_key:
          description: |
            The data key holding the id of the row's parent. It must map to the same values in every
            view of the comparison tool, though not necessarily through the same field, since different
            views can read different collections. Equal to row_id_data_key means the view's rows are
            their own parents; a different key means the view's rows are children. Null when the view
            declares no hierarchy.
          example: rna_composite_id
          nullable: true
          type: string
        parent_noun:
          allOf:
            - $ref: '#/components/schemas/ComparisonToolNoun'
          description: |
            The noun for this view's parent records, used to label parent counts. Set by a child view,
            which displays both counts. Null otherwise.
          example:
            singular: gene
            plural: genes
          nullable: true
          type: object
        view_noun:
          allOf:
            - $ref: '#/components/schemas/ComparisonToolNoun'
          description: |
            The noun for this view's own records, used to label row counts. Any view can set it to
            override the generic nouns in the comparison table. Null otherwise.
          example:
            singular: protein
            plural: proteins
          nullable: true
          type: object
      required:
        - columns
        - dropdowns
        - filters
        - page
        - row_count
      type: object
    BasicError:
      description: Problem details (tools.ietf.org/html/rfc7807)
      properties:
        title:
          description: A human readable documentation for the problem type
          type: string
        status:
          description: The HTTP status code
          type: integer
        detail:
          description: A human readable explanation specific to this occurrence of
            the problem
          type: string
        type:
          description: An absolute URI that identifies the problem type
          type: string
        instance:
          description: An absolute URI that identifies the specific occurrence of
            the problem
          type: string
      required:
        - status
        - title
      type: object
    ItemFilterTypeQuery:
      default: include
      description: |
        - include: Include only the specified items.
        - exclude: Exclude the specified items.
      enum:
        - include
        - exclude
      type: string
    EqtlSearchQuery:
      description: eQTL search query with pagination and filtering options.
      properties:
        pageNumber:
          default: 0
          description: The page number.
          example: 0
          format: int32
          minimum: 0
          type: integer
        pageSize:
          default: 100
          description: The number of items in a single page.
          example: 100
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        remainingBudget:
          description: |
            Maximum number of rows to return, letting a client retrieve matching rows from beyond the
            current page in a single request. When set, pageNumber and pageSize are ignored. Only
            applied when itemFilterType is 'exclude'.
          example: 50
          format: int32
          maximum: 50
          minimum: 1
          nullable: true
          type: integer
        items:
          description: |
            List of composite identifiers to filter by. Each identifier uses the format
            "variant~ensembl_gene_id~cell_type_id" where each identifier represents one complete
            combination of variant, Ensembl gene ID, and cell type ID.

            Example: "rs12655812~ENSG00000250891~astro" filters for documents matching that exact combination.
            Multiple items can be provided to filter for multiple specific combinations.
          example:
            - rs12655812~ENSG00000250891~astro
            - rs170094~ENSG00000136267~astro
          items:
            type: string
          nullable: true
          type: array
        itemFilterType:
          $ref: '#/components/schemas/ItemFilterTypeQuery'
        search:
          description: |
            Search by variant, gene symbol, or Ensembl gene ID. A single term is a case-insensitive partial
            match on any of the three; a comma separated list full-matches each term, case-insensitively,
            against any of the three.
            Examples: 'rs170094,DGKB' (comma-separated list) or 'dgk' (partial match). Only applied when
            itemFilterType is 'exclude'.
          example: 'rs170094,DGKB'
          nullable: true
          type: string
        variant:
          description: Filter by variant.
          example:
            - rs12655812
            - rs170094
          items:
            type: string
          nullable: true
          type: array
        gene:
          description: Filter by gene symbol.
          example:
            - DGKB
            - LINC02208
          items:
            type: string
          nullable: true
          type: array
        cellClass:
          description: Filter by cell class.
          example:
            - Astrocyte
          items:
            type: string
          nullable: true
          type: array
        cellSubclass:
          description: Filter by cell subclass.
          example:
            - Astrocyte
            - Layer 3-5 Intratelencephalic Excitatory Neuron 1
          items:
            type: string
          nullable: true
          type: array
        sortFields:
          description: |
            List of field names to sort by (e.g., ["adj_p_val", "variant"]).
            Each field in sortFields must have a corresponding order in sortOrders.
          example:
            - adj_p_val
            - variant
          items:
            type: string
          minItems: 1
          type: array
        sortOrders:
          description: |
            List of sort directions corresponding to sortFields.
            Values: 1 (ascending) or -1 (descending).
            Must have the same length as sortFields.
          example:
            - 1
            - 1
          items:
            enum:
              - 1
              - -1
            format: int32
            type: integer
          minItems: 1
          type: array
      required:
        - sortFields
        - sortOrders
      type: object
    GenomicLocation:
      description: A location on a chromosome
      example:
        start: 118488207
        end: 118488208
        chr: '5'
      properties:
        chr:
          description: Chromosome name
          example: '5'
          type: string
        start:
          description: Start position
          example: 118488207
          format: int32
          type: integer
        end:
          description: End position
          example: 118488208
          format: int32
          type: integer
      required:
        - chr
        - end
        - start
      type: object
    EffectDirection:
      description: Direction of the variant's effect on gene expression
      enum:
        - Up
        - Down
      type: string
    Eqtl:
      description: eQTL
      example:
        gene_symbol: LINC02208
        adj_p_val_numeric: -161.583901
        minor_allele: C
        cell_subclass: Astrocyte
        effect_direction: Up
        adj_p_val: 2.61E-162
        composite_id: rs12655812~ENSG00000250891~astro
        maf: 0.1418
        reference_allele: T
        cell_class: Astrocyte
        cell_subclass_short: Astro
        ensembl_gene_id: ENSG00000250891
        cell_class_short: Astro
        variant: rs12655812
        cell_type_id: astro
        variant_location:
          start: 118488207
          end: 118488208
          chr: '5'
        gene_location:
          start: 118488207
          end: 118488208
          chr: '5'
        beta: 0.608491
      properties:
        composite_id:
          description: Unique identifier for the eQTL object
          example: rs12655812~ENSG00000250891~astro
          type: string
        variant:
          description: Variant ID
          example: rs12655812
          type: string
        variant_location:
          $ref: '#/components/schemas/GenomicLocation'
        effect_direction:
          $ref: '#/components/schemas/EffectDirection'
        gene_symbol:
          description: Gene symbol
          example: LINC02208
          type: string
        ensembl_gene_id:
          description: Ensembl gene ID
          example: ENSG00000250891
          type: string
        gene_location:
          $ref: '#/components/schemas/GenomicLocation'
        beta:
          description: Effect size
          example: 0.608491
          type: number
        adj_p_val:
          description: 'Adjusted p-value, preformatted for display'
          example: 2.61E-162
          type: string
        adj_p_val_numeric:
          description: Base-10 logarithm of the adjusted p-value
          example: -161.583901
          type: number
        maf:
          description: Minor allele frequency
          example: 0.1418
          type: number
        minor_allele:
          description: Minor allele
          example: C
          type: string
        reference_allele:
          description: Reference allele
          example: T
          type: string
        cell_type_id:
          description: Cell type ID
          example: astro
          type: string
        cell_class:
          description: Cell class
          example: Astrocyte
          type: string
        cell_class_short:
          description: Abbreviated cell class
          example: Astro
          type: string
        cell_subclass:
          description: Cell subclass
          example: Astrocyte
          type: string
        cell_subclass_short:
          description: Abbreviated cell subclass
          example: Astro
          type: string
      required:
        - adj_p_val
        - adj_p_val_numeric
        - beta
        - cell_class
        - cell_class_short
        - cell_subclass
        - cell_subclass_short
        - cell_type_id
        - composite_id
        - effect_direction
        - ensembl_gene_id
        - gene_location
        - gene_symbol
        - maf
        - minor_allele
        - reference_allele
        - variant
        - variant_location
      type: object
    PageMetadata:
      description: The metadata of a page.
      example:
        number: 0
        size: 100
        totalPages: 3
        hasPrevious: false
        hasNext: true
        totalElements: 250
      properties:
        number:
          description: The page number.
          example: 0
          type: integer
        size:
          description: The number of items in a single page.
          example: 100
          type: integer
        totalElements:
          description: Total number of elements in the result set.
          example: 250
          format: int64
          type: integer
        totalPages:
          description: Total number of pages in the result set.
          example: 3
          type: integer
        hasNext:
          description: Returns if there is a next page.
          example: true
          type: boolean
        hasPrevious:
          description: Returns if there is a previous page.
          example: false
          type: boolean
      required:
        - hasNext
        - hasPrevious
        - number
        - size
        - totalElements
        - totalPages
      type: object
    EqtlsPage:
      description: A paginated response containing eQTL objects and pagination metadata.
      example:
        eqtls:
          - gene_symbol: LINC02208
            adj_p_val_numeric: -161.583901
            minor_allele: C
            cell_subclass: Astrocyte
            effect_direction: Up
            adj_p_val: 2.61E-162
            composite_id: rs12655812~ENSG00000250891~astro
            maf: 0.1418
            reference_allele: T
            cell_class: Astrocyte
            cell_subclass_short: Astro
            ensembl_gene_id: ENSG00000250891
            cell_class_short: Astro
            variant: rs12655812
            cell_type_id: astro
            variant_location:
              start: 118488207
              end: 118488208
              chr: '5'
            gene_location:
              start: 118488207
              end: 118488208
              chr: '5'
            beta: 0.608491
          - gene_symbol: LINC02208
            adj_p_val_numeric: -161.583901
            minor_allele: C
            cell_subclass: Astrocyte
            effect_direction: Up
            adj_p_val: 2.61E-162
            composite_id: rs12655812~ENSG00000250891~astro
            maf: 0.1418
            reference_allele: T
            cell_class: Astrocyte
            cell_subclass_short: Astro
            ensembl_gene_id: ENSG00000250891
            cell_class_short: Astro
            variant: rs12655812
            cell_type_id: astro
            variant_location:
              start: 118488207
              end: 118488208
              chr: '5'
            gene_location:
              start: 118488207
              end: 118488208
              chr: '5'
            beta: 0.608491
        page:
          number: 0
          size: 100
          totalPages: 3
          hasPrevious: false
          hasNext: true
          totalElements: 250
      properties:
        eqtls:
          description: The list of eQTL objects for the current page
          items:
            $ref: '#/components/schemas/Eqtl'
          type: array
        page:
          $ref: '#/components/schemas/PageMetadata'
      required:
        - eqtls
        - page
      type: object
    DataVersion:
      description: Synapse data version
      example:
        data_file: data_file
        data_version: data_version
      properties:
        data_file:
          type: string
        data_version:
          type: string
      required:
        - data_file
        - data_version
      type: object
