server:
  port: 3334
  forward-headers-strategy: native
  # Comparison tool requests carry one `items` parameter per row, so URLs run to several
  # kilobytes. Kept high so Tomcat never decides how long a URL may be; the upstream proxy or
  # load balancer does. This counts the request line and headers together, unlike an edge cap on
  # the request line alone, so check the deployed limits before changing it.
  max-http-request-header-size: 64KB

spring:
  application:
    name: model-ad-api-next
  data:
    mongodb:
      host: model-ad-mongo
      port: 27017
      database: model-ad
      username: root
      password: changeme
      authentication-database: admin
  jackson:
    date-format: org.sagebionetworks.model.ad.api.next.RFC3339DateFormat
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      probes:
        enabled: true
