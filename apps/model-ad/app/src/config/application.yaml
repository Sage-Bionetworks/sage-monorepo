# Base configuration for Model-AD App
# Default values can be overridden by:
# 1. Profile-specific files (e.g., application-dev.yaml)
# 2. Environment variables (e.g., APP_VERSION, CSR_API_URL, GOOGLE_TAG_MANAGER_ID)

appVersion: local
commitSha: ''
csrApiUrl: http://localhost:8000/api/v2
ssrApiUrl: http://model-ad-api-next:3334/v2
apiDocsUrl: http://localhost:8000/api-docs
googleTagManagerEnabled: true
googleTagManagerId: ''
sentryDsn: ''
sentryEnvironment: ''
sentryRelease: ''
# Performance data sample rate, from 0.0 to 1.0 (0.1 = 10% of traces), set by
# SENTRY_TRACES_SAMPLE_RATE. Unset (null) turns performance tracing off.
sentryTracesSampleRate: null
environment: dev
