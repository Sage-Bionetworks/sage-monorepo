[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Hallie Swan", email = "hallie.swan@sagebase.org"},
]
requires-python = "==3.11.9"
dependencies = [
    "explorers-data-loader",
]
name = "agora-data"
version = "0.1.0"
description = "Agora Data Release"
readme = "README.md"

[dependency-groups]
dev = []
prod = []
test = []

[tool.uv]
default-groups = []

[tool.uv.sources]
explorers-data-loader = { path = "../../../libs/explorers/data-loader", editable = true }
